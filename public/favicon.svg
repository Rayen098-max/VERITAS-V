  <circle cx="32" cy="32" r="17" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="11" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5"/>
  
  <!-- Verification Aperture / Spiral Core -->
