  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#0A0A0B"/>
  <circle cx="32" cy="32" r="28" fill="url(#veritasGlow)"/>
  
  <!-- Outer Orbit Rings -->
